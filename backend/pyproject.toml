[project]
name = "backend"
version = "0.1.0"
description = "RHIPay BIS Nexus Hub & ZKP Core Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "qrcode[pil]>=8.2",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
