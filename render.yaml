services:
  # 1. RHIPay Nexus Hub & ZKP Verification Backend
  - type: web
    name: rhipay-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: rhipay-postgres
          property: connectionString

databases:
  # 2. Managed PostgreSQL Database
  - name: rhipay-postgres
    databaseName: rhipay
    user: rhipay_admin
    plan: free
    ipAllowList: []
